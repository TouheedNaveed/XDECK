<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data:; connect-src 'self' http://localhost:* http://127.0.0.1:*;">
  <title>XDECK</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { background: transparent; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #e0e7ff;
      min-height: 100vh;
      -webkit-app-region: drag;
      user-select: none;
      overflow: hidden;
      border-radius: 16px;
    }

    .titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px 8px;
      -webkit-app-region: drag;
    }
    .titlebar-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .titlebar h1 {
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(135deg, #c084fc, #e879f9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .titlebar-logo {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      mix-blend-mode: screen;
    }
    .titlebar-buttons {
      display: flex;
      gap: 6px;
      -webkit-app-region: no-drag;
    }
    .titlebar-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: none;
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.5);
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .titlebar-btn:hover { background: rgba(255,255,255,0.15); color: white; }
    .titlebar-btn.close:hover { background: rgba(239,68,68,0.8); color: white; }

    .container {
      padding: 0 20px 20px;
      height: calc(100vh - 48px);
      overflow-y: auto;
      -webkit-app-region: no-drag;
      scrollbar-width: none; /* Firefox */
      -ms-overflow-style: none;  /* IE and Edge */
    }
    .container::-webkit-scrollbar {
      display: none; /* Chrome, Safari, Opera */
    }

    .qr-section {
      text-align: center;
      margin: 12px 0 16px;
    }
    .qr-section #qr {
      width: 180px;
      height: 180px;
      border-radius: 16px;
      background: white;
      padding: 8px;
    }

    .info-card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 12px 16px;
      margin: 8px 0;
    }
    .info-card label {
      display: block;
      font-size: 11px;
      color: rgba(255,255,255,0.45);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .info-card .value {
      font-size: 18px;
      font-weight: 600;
      font-family: 'SF Mono', 'Fira Code', monospace;
      letter-spacing: 2px;
    }

    .btn {
      -webkit-app-region: no-drag;
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      background: rgba(139, 92, 246, 0.4);
      color: white;
      border: 1px solid rgba(255,255,255,0.15);
      transition: all 0.2s;
    }
    .btn:hover { background: rgba(139, 92, 246, 0.6); }

    .status {
      text-align: center;
      margin-top: 14px;
      font-size: 12px;
      color: rgba(255,255,255,0.4);
    }
    .status .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4ade80;
      margin-right: 6px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .devices-section {
      margin-top: 12px;
    }
    .devices-section h3 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: rgba(255,255,255,0.4);
      margin-bottom: 6px;
    }
    .device-list {
      max-height: 80px;
      overflow-y: auto;
    }
    .device-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      font-size: 12px;
      color: rgba(255,255,255,0.6);
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .device-item:last-child { border-bottom: none; }
    .device-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
    }
    .empty-devices {
      font-size: 12px;
      color: rgba(255,255,255,0.25);
      font-style: italic;
    }

    .relay-section {
      margin-top: 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 14px;
    }
    .relay-section h3 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: rgba(255,255,255,0.4);
      margin-bottom: 10px;
    }
    .relay-section input {
      -webkit-app-region: no-drag;
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.3);
      color: white;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 13px;
      letter-spacing: 1px;
      outline: none;
      margin-bottom: 8px;
    }
    .relay-section input::placeholder { color: rgba(255,255,255,0.2); }
    .relay-section input:focus { border-color: rgba(139,92,246,0.6); }
    .relay-btn {
      -webkit-app-region: no-drag;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .relay-btn.connect {
      background: rgba(74, 222, 128, 0.3);
      color: #4ade80;
      border: 1px solid rgba(74, 222, 128, 0.3);
    }
    .relay-btn.connect:hover { background: rgba(74, 222, 128, 0.5); }
    .relay-btn.disconnect {
      background: rgba(239, 68, 68, 0.3);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .relay-btn.disconnect:hover { background: rgba(239, 68, 68, 0.5); }
    .relay-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      margin-top: 8px;
      color: rgba(255,255,255,0.4);
    }
    .relay-status .dot { width: 6px; height: 6px; border-radius: 50%; margin-right: 0; }
    .relay-status .dot.connected { background: #4ade80; }
    .relay-status .dot.disconnected { background: #f87171; }
  </style>
</head>
<body>
  <div class="titlebar">
    <div class="titlebar-left">
      <img id="logo" class="titlebar-logo" src="icon.png" alt="">
      <h1>XDECK</h1>
    </div>
    <div class="titlebar-buttons">
      <button class="titlebar-btn" id="minimizeBtn">−</button>
      <button class="titlebar-btn close" id="closeBtn">×</button>
    </div>
  </div>
  <div class="container">
    <div class="qr-section">
      <img id="qr" src="" alt="QR Code">
    </div>
    <div class="info-card">
      <label>Server Address</label>
      <div class="value" id="ip">Loading...</div>
    </div>
    <div class="info-card">
      <label>Pairing Code</label>
      <div class="value" id="code">------</div>
    </div>
    <button class="btn" id="regenBtn">Generate New Code</button>

    <div class="devices-section">
      <h3>Connected Devices</h3>
      <div class="device-list" id="deviceList">
        <div class="empty-devices">No devices connected</div>
      </div>
    </div>

    <div class="relay-section">
      <h3>Cloud Relay</h3>
      <p style="font-size:10px;color:rgba(255,255,255,0.4);margin:0 0 6px;text-align:center;line-height:1.45;">Enter the license key from your purchase confirmation.<br>Each key works on one computer and one phone at a time.</p>
      <input type="text" id="relayKey" placeholder="XDECK-XXXX-XXXX-XXXX-XXXX" spellcheck="false">
      <button class="relay-btn connect" id="relayConnectBtn">Connect</button>
      <div class="relay-status">
        <span class="dot disconnected" id="relayDot"></span>
        <span id="relayStatusText">Disconnected</span>
      </div>
      <div id="relayError" style="display:none;font-size:10px;color:#fca5a5;margin-top:6px;text-align:center;line-height:1.45;"></div>
    </div>

    <!-- Update Banner -->
    <div id="updateBanner" style="display:none; margin-top:14px; background:rgba(74, 222, 128, 0.1); border: 1px solid rgba(74, 222, 128, 0.2); border-radius:12px; padding:12px; text-align:center;">
      <p id="updateText" style="font-size:11px; color:#4ade80; margin-bottom:8px; font-weight:500;"></p>
      <button id="updateBtn" class="btn" style="margin-top:0; display:none; background:#4ade80; color:#1a1a2e; border:none; padding:6px 12px; border-radius:8px; font-weight:700; cursor:pointer;">Update Now</button>
    </div>

    <div class="status" style="display:flex; justify-content:space-between; align-items:center; margin-top:14px;">
      <div style="display:flex; align-items:center;">
        <span class="dot"></span>
        <span id="statusText">Server running</span>
      </div>
      <span id="appVersion" style="font-size:10px; color:rgba(255,255,255,0.3); font-weight:500; font-family:monospace;">v1.1.5</span>
    </div>
  </div>
  <script>
    async function loadPairingInfo() {
      try {
        var info = await window.xdeck.getPairingInfo();
        // If IPC didn't populate yet (server still starting), fetch directly
        if (!info || !info.qr) {
          try {
            var res = await fetch('http://127.0.0.1:8787/pairing');
            info = await res.json();
          } catch(e2) {}
        }
        if (info && info.qr) {
          document.getElementById('qr').src = info.qr;
          document.getElementById('ip').textContent = info.ip + ':' + info.port;
          document.getElementById('code').textContent = info.code;
        }
      } catch(e) { console.error('Pairing info error:', e); }
    }

    async function loadDevices() {
      try {
        const devices = await window.xdeck.getDevices();
        const list = document.getElementById('deviceList');
        if (!devices || devices.length === 0) {
          list.innerHTML = '<div class="empty-devices">No devices connected</div>';
        } else {
          list.innerHTML = devices.map(function(d) {
            return '<div class="device-item"><span class="device-dot"></span>' + d.ip + '</div>';
          }).join('');
        }
      } catch(e) {
        console.error('Devices error:', e);
      }
    }

    document.getElementById('regenBtn').addEventListener('click', async function() {
      var btn = document.getElementById('regenBtn');
      btn.textContent = 'Generating...';
      btn.disabled = true;
      try {
        var info = await window.xdeck.regeneratePairing();
        document.getElementById('qr').src = info.qr;
        document.getElementById('ip').textContent = info.ip + ':' + info.port;
        document.getElementById('code').textContent = info.code;
      } catch(e) { console.error('Regen error:', e); }
      btn.textContent = 'Generate New Code';
      btn.disabled = false;
    });

    document.getElementById('minimizeBtn').addEventListener('click', function() { window.xdeck.minimizeWindow(); });
    document.getElementById('closeBtn').addEventListener('click', function() { window.xdeck.closeWindow(); });

    function showRelayError(message) {
      var el = document.getElementById('relayError');
      el.textContent = message || '';
      el.style.display = message ? 'block' : 'none';
    }

    async function loadRelayStatus() {
      try {
        const res = await fetch('http://localhost:8787/relay/status');
        const data = await res.json();
        const dot = document.getElementById('relayDot');
        const text = document.getElementById('relayStatusText');
        const btn = document.getElementById('relayConnectBtn');
        const input = document.getElementById('relayKey');
        if (data.connected) {
          dot.className = 'dot connected';
          text.textContent = 'Connected';
          btn.textContent = 'Disconnect';
          btn.className = 'relay-btn disconnect';
        } else {
          dot.className = 'dot disconnected';
          text.textContent = data.authFailed ? 'Key rejected' : 'Disconnected';
          btn.textContent = 'Connect';
          btn.className = 'relay-btn connect';
        }
        if (data.licenseKey && input.value.trim() === '') input.value = data.licenseKey;
        showRelayError(data.error);
      } catch(e) {}
    }

    document.getElementById('relayConnectBtn').addEventListener('click', async function() {
      const btn = document.getElementById('relayConnectBtn');
      const input = document.getElementById('relayKey');
      const key = input.value.trim();
      const disconnecting = btn.classList.contains('disconnect');
      if (!disconnecting && !key) {
        showRelayError('Enter the license key from your purchase confirmation.');
        input.focus();
        return;
      }
      btn.textContent = disconnecting ? 'Disconnecting...' : 'Connecting...';
      btn.disabled = true;
      showRelayError('');
      try {
        if (disconnecting) {
          await fetch('http://localhost:8787/relay/disconnect', { method: 'POST' });
        } else {
          const res = await fetch('http://localhost:8787/relay/connect', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ key })
          });
          if (!res.ok) {
            const data = await res.json().catch(function() { return {}; });
            showRelayError(data.error || 'Could not start Cloud Relay.');
          }
        }
      } catch(e) {}
      btn.disabled = false;
      // The relay answers in well under a second; check twice so a rejected key
      // reports its reason instead of just flipping back to "Disconnected".
      setTimeout(loadRelayStatus, 1000);
      setTimeout(loadRelayStatus, 3000);
    });

    function formatLicenseKey(value) {
      var clean = value.replace(/[^A-Za-z0-9]/g, '').toUpperCase().slice(0, 21);
      var raw = clean;
      if (raw.length > 0 && !raw.startsWith('XDECK')) {
        if (raw.length <= 16) {
          raw = 'XDECK' + raw;
        }
      }
      var formatted = '';
      if (raw.length > 0) formatted += raw.slice(0, 5);
      if (raw.length > 5) formatted += '-' + raw.slice(5, 9);
      if (raw.length > 9) formatted += '-' + raw.slice(9, 13);
      if (raw.length > 13) formatted += '-' + raw.slice(13, 17);
      if (raw.length > 17) formatted += '-' + raw.slice(17, 21);
      return formatted;
    }

    document.getElementById('relayKey').addEventListener('input', function(e) {
      var start = e.target.selectionStart;
      var val = e.target.value;
      var formatted = formatLicenseKey(val);
      e.target.value = formatted;
      var diff = formatted.length - val.length;
      if (diff > 0) {
        e.target.setSelectionRange(start + diff, start + diff);
      } else {
        e.target.setSelectionRange(start, start);
      }
    });

    loadRelayStatus();
    setInterval(loadRelayStatus, 5000);
    loadPairingInfo();
    setInterval(loadPairingInfo, 3000);
    loadDevices();
    setInterval(loadDevices, 3000);

    // Dynamic version loading
    if (window.xdeck && typeof window.xdeck.getVersion === 'function') {
      window.xdeck.getVersion().then(function(v) {
        if (v) document.getElementById('appVersion').textContent = 'v' + v;
      });
    }

    // Auto-update event listeners
    if (window.xdeck && typeof window.xdeck.onUpdateStatus === 'function') {
      window.xdeck.onUpdateStatus(function(event, status) {
        var banner = document.getElementById('updateBanner');
        var text = document.getElementById('updateText');
        var btn = document.getElementById('updateBtn');

        if (status === 'checking') {
          banner.style.display = 'block';
          text.textContent = 'Checking for updates...';
          btn.style.display = 'none';
        } else if (status === 'available') {
          banner.style.display = 'block';
          text.textContent = 'New update available! Downloading...';
          btn.style.display = 'none';
        } else if (status === 'downloading') {
          banner.style.display = 'block';
          text.textContent = 'Downloading latest version...';
          btn.style.display = 'none';
        } else if (status === 'downloaded') {
          banner.style.display = 'block';
          text.textContent = 'Update downloaded and ready!';
          btn.style.display = 'inline-block';
        } else if (status === 'error') {
          banner.style.display = 'block';
          text.textContent = 'Failed to check or download update.';
          btn.style.display = 'none';
          setTimeout(function() {
            banner.style.display = 'none';
          }, 4000);
        }
      });
    }

    document.getElementById('updateBtn').addEventListener('click', function() {
      if (window.xdeck && typeof window.xdeck.installUpdate === 'function') {
        document.getElementById('updateBtn').textContent = 'Installing...';
        window.xdeck.installUpdate();
      }
    });
  </script>
</body>
</html>
