name: Build & Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            build_cmd: npm run build:linux
          - os: windows-latest
            platform: windows
            build_cmd: npm run build:win
          - os: macos-latest
            platform: mac
            build_cmd: npm run build:mac

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install PWA dependencies
        working-directory: mobile-pwa
        run: npm install

      - name: Build PWA
        working-directory: mobile-pwa
        run: npm run build

      - name: Install desktop dependencies
        working-directory: desktop-app
        run: npm install

      - name: Build TypeScript
        working-directory: desktop-app
        run: npx tsc --skipLibCheck

      - name: Copy renderer assets
        working-directory: desktop-app
        run: |
          mkdir -p dist/desktop-app/src/renderer
          mkdir -p dist/desktop-app/assets
          cp -r src/renderer/* dist/desktop-app/src/renderer/
          cp assets/icon.png dist/desktop-app/assets/icon.png
          cp assets/icon.png dist/desktop-app/src/renderer/icon.png

      - name: Build Electron package
        working-directory: desktop-app
        run: ${{ matrix.build_cmd }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xdeck-${{ matrix.platform }}
          path: |
            desktop-app/release/*.deb
            desktop-app/release/*.AppImage
            desktop-app/release/*.exe
            desktop-app/release/*.dmg
            desktop-app/release/*.yml
            desktop-app/release/*.yaml
          if-no-files-found: warn

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install PWA dependencies
        working-directory: mobile-pwa
        run: npm install

      - name: Build PWA
        working-directory: mobile-pwa
        run: npm run build

      - name: Install Capacitor
        working-directory: mobile-pwa
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Sync Capacitor project
        working-directory: mobile-pwa
        run: |
          npx cap add android || true
          npx cap sync

      - name: Update JVM compatibility & Cleartext settings
        working-directory: mobile-pwa/android
        run: |
          if ! grep -q "subprojects" build.gradle; then
            cat << 'EOF' >> build.gradle
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      project.android {
                          compileOptions {
                              sourceCompatibility = JavaVersion.VERSION_17
                              targetCompatibility = JavaVersion.VERSION_17
                          }
                      }
                  }
              }
          }
          EOF
          fi
          MANIFEST="app/src/main/AndroidManifest.xml"
          if ! grep -q "usesCleartextTraffic" "$MANIFEST"; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' "$MANIFEST"
          fi

      - name: Build Android APK
        working-directory: mobile-pwa/android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xdeck-android
          path: mobile-pwa/android/app/build/outputs/apk/debug/app-debug.apk

  release:
    needs: [build, build-android]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: version
        run: echo "tag=v$(node -p "require('./desktop-app/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f

      - name: Delete old latest release
        if: startsWith(github.ref, 'refs/heads/main')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true

      - name: Create latest release (rolling)
        if: startsWith(github.ref, 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          draft: false
          prerelease: false
          generate_release_notes: false
          files: |
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.apk
            artifacts/**/*.yml
            artifacts/**/*.yaml

      - name: Create versioned release (for APK update check)
        if: startsWith(github.ref, 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.apk
