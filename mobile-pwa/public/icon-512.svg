<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c084fc;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#e879f9;stop-opacity:0.3" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:0.9" />
    </linearGradient>
  </defs>

  <!-- Background circle with gradient -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- Glass overlay -->
  <circle cx="256" cy="256" r="230" fill="url(#glass)" opacity="0.4"/>

  <!-- Grid of 4 glassmorphism squares representing deck buttons -->
  <!-- Top-left -->
  <rect x="108" y="108" width="120" height="120" rx="24" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <!-- Top-right -->
  <rect x="284" y="108" width="120" height="120" rx="24" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <!-- Bottom-left -->
  <rect x="108" y="284" width="120" height="120" rx="24" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <!-- Bottom-right -->
  <rect x="284" y="284" width="120" height="120" rx="24" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>

  <!-- Lightning bolt icon in center (representing quick action) -->
  <g transform="translate(256, 256) scale(0.55)">
    <path d="M12 -40 L-20 8 L-4 8 L-12 40 L24 -8 L6 -8 Z" fill="url(#iconGrad)" filter="url(#innerGlow)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  </g>

  <!-- Small accent dots on each glass square -->
  <circle cx="150" cy="150" r="8" fill="url(#glow)" opacity="0.7"/>
  <circle cx="362" cy="150" r="8" fill="url(#glow)" opacity="0.7"/>
  <circle cx="150" cy="362" r="8" fill="url(#glow)" opacity="0.7"/>
  <circle cx="362" cy="362" r="8" fill="url(#glow)" opacity="0.7"/>

  <!-- Subtle outer ring -->
  <circle cx="256" cy="256" r="232" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
</svg>