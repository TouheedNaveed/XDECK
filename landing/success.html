<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XDECK — Purchase Complete</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'DM Sans', sans-serif; background: #0a0a0f; color: #fff; }
    .font-heading { font-family: 'Space Grotesk', sans-serif; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center px-6">
  <div class="max-w-md text-center">
    <div class="w-20 h-20 mx-auto mb-6 rounded-full bg-gradient-to-br from-green-400 to-emerald-600 flex items-center justify-center">
      <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
      </svg>
    </div>
    <h1 class="font-heading text-3xl font-bold mb-3">Payment Successful!</h1>
    <p class="text-white/60 mb-8">Your license key has been sent to your email. Check your inbox (and spam folder).</p>
    <div class="glass-card rounded-2xl p-6 mb-8">
      <p class="text-sm text-white/40 mb-2">License key format:</p>
      <p class="font-mono text-lg text-white/80">XDECK-XXXX-XXXX-XXXX-XXXX</p>
    </div>
    <p class="text-sm text-white/40 mb-6">Enter this key in the XDECK desktop app under <strong>Cloud Relay</strong> pairing mode.</p>
    <a href="index.html" class="inline-block px-6 py-3 bg-white/10 rounded-xl text-white/70 hover:text-white hover:bg-white/15 transition-all">
      Back to XDECK
    </a>
  </div>
</body>
</html>
